[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscrape"
version = "1.0.0"
description = "Universal, reusable web scraping framework for any client and any website in Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "OmniScrape Team"}
]
keywords = ["web-scraping", "crawler", "scraper", "data-extraction", "beautifulsoup", "httpx", "playwright"]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dynamic = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
omniscrape = "omniscrape.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["omniscrape*"]
exclude = ["output*", "tests*"]
